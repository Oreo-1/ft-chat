name: ftchat
description: "ft-chat: personal chat for notes and file transfer between my devices."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  pocketbase: ^0.26.0
  shared_preferences: ^2.5.6
  file_picker: ^13.3.3
  url_launcher: ^6.3.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
